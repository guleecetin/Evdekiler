services:
  postgres:
    image: postgres:17
    container_name: evdekiler-postgres
    environment:
      POSTGRES_USER: evdekiler
      POSTGRES_PASSWORD: evdekiler_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: evdekiler-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: evdekiler
      RABBITMQ_DEFAULT_PASS: evdekiler_dev_pw
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: evdekiler-redis
    ports:
      - "6379:6379"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: evdekiler-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  rabbitmq-data:
  azurite-data: