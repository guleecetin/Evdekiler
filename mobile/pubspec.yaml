name: evdekiler
description: "Evdekiler: buzdolabındakilerle ne pişirsem?"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.1.3
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.7
  shimmer: ^4.0.0
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.3
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1d3a2a"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#1d3a2a"
    image: assets/branding/splash_logo.png
